[project]
name = "wealth-advisor"
version = "0.1.0"
description = "Multi-agent Wealth Advisor Assistant — LangGraph supervisor agent system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=1.0",
  "openai>=1.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "streamlit>=1.37",
  "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.2",
  "pytest-cov>=5.0",
]

[project.scripts]
wealth-advisor = "wealth_advisor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wealth_advisor"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts", "ui"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["wealth_advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "evals: slow evaluation tests against labelled data (excluded by default)",
]

[tool.coverage.run]
source = ["src/wealth_advisor"]
